function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(window._tt);window._tt=setTimeout(()=>t.style.display='none',2300)}
function modal(h){$('sheet').innerHTML=h;$('modal').classList.add('on')}

function alive(){return S.p&&S.p.stage!=='ret'}

/* ===== 연출(로딩) ===== */
async function cine(o){
  const sp=S.speed;if(sp===0)return;
  const el=$('cine'),items=o.items||[],from=o.from||0,n=o.boxes?o.boxes.length:items.length;
  el.className='on'+(o.dark?' dark':'');
  const row=(it,i)=>`<div class="cr ${i<from?'done':''}" id="cr${i}"><span class="m">${it.l}</span><b>${it.n}</b><em>${i<from?it.r:''}</em></div>`;
  el.innerHTML=`<div class="ci"><small>${o.eyebrow}</small><h1>${o.title}</h1><p>${o.sub||''}</p>${o.boxes?`<div class="bxs">${o.boxes.map((b,i)=>`<div class="bx" id="bx${i}">${b}</div>`).join('')}</div>`:items.map(row).join('')}<div class="pg"><i id="pgi" style="width:${from/n*100}%"></i></div><p class="ft">${o.foot||''}</p></div>`;
  await sleep(450*sp);
  if(o.boxes){
    for(let i=0;i<n;i++){$('bx'+i).classList.add('on');$('pgi').style.width=((i+1)/n*100)+'%';await sleep(850*sp);if(i===o.hit){$('bx'+i).classList.add('hit');await sleep(500*sp);break}}
  }else{
    for(let i=from;i<n;i++){
      const r=$('cr'+i);r.className='cr now';r.querySelector('em').textContent='진행 중';$('pgi').style.width=((i+.5)/n*100)+'%';
      await sleep(1000*sp);r.className='cr done';r.querySelector('em').textContent=items[i].r;$('pgi').style.width=((i+1)/n*100)+'%';await sleep(380*sp);
      if(o.once)break;
    }
  }
  await sleep(750*sp);el.className='';
}
function cycSpeed(){S.speed=S.speed===1?.4:S.speed===.4?0:1;save();toast('연출 속도: '+(S.speed===1?'보통':S.speed===.4?'빠르게':'건너뛰기'));render()}

/* ===== 렌더링 ===== */
function render(){
  const el=$('screen'),old=el.querySelector('.body'),st=old?old.scrollTop:0,p=S.p;
  const key=view+tab+(p?p.phase+p.stage+p.hsT:'');
  el.innerHTML=view==='home'?vHome():view==='create'?vCreate():view==='cand'?vCand():vGame();
  if(key!==lastKey){el.style.animation='none';void el.offsetWidth;el.style.animation='in .35s ease both'}
  else{const nb=el.querySelector('.body');if(nb)nb.scrollTop=st}
  lastKey=key;
}
function hdr(p){
  const b=p.stage==='pro'?CL[p.club].n.slice(0,2):p.stage==='univ'?'대학':'고교';
  return `<div class="hd"><button class="ib" onclick="goHome()">🏠</button><div class="bd">${b}</div><div class="who"><b>${esc(p.name||'이름 미정')}</b><span>${POS[p.pos]} ${p.age}세</span></div><div class="ov"><small>OVR</small><b>${ovr(p).toFixed(1)}</b></div><button class="ib" onclick="cycSpeed()">${S.speed===1?'▶':S.speed===.4?'⏩':'⏭'}</button></div>`;
}
function goHome(){view='home';render()}
function setTab(t){tab=t;render()}

  <div class="nl"><div class="eb">NEW FOOTBALL LIFE</div><h2>이번 생, 다시 시작할까요?</h2><p>다시 한번 축구 인생을 시작하세요.</p></div>

}
function startNew(){

/* ===== 선수 생성 ===== */

  <label class="l">출신 고등학교</label><input class="tx" maxlength="12" placeholder="학교 이름을 입력하세요 (예: 거제고)" value="${esc(cr.school)}" oninput="cr.school=this.value;chk()">

/* ===== 후보 3명 / 육성 선택 ===== */
function genCand(pos){
  return ARCH[pos].map(a=>{let s=a[2].map(w=>w*10+(Math.random()*1.8-.9));const t=sum(s);s=s.map(v=>r1(v*50/t));const d=r1(50-sum(s)),mx=Math.max(...s);s[s.indexOf(mx)]=r1(mx+d);return{l:a[0],sub:a[1],s}});
}
function toCand(){cand=genCand(cr.pos);ch={i:0,role:0,style:SREC[cr.pos],focus:[],rr:3};view='cand';render()}
function selCand(i){ch.i=i;ch.role=i;render()}
function reroll(){if(ch.rr<=0){toast('다시 뽑기 기회를 모두 사용했어요');return}cand=genCand(cr.pos);ch.rr--;render()}
function togFocus(i){const k=ch.focus.indexOf(i);if(k>=0)ch.focus.splice(k,1);else if(ch.focus.length<2)ch.focus.push(i);else toast('집중 육성은 최대 2개까지예요');render()}

  <h2>${POS[pos]} 후보 3명</h2>

  <div class="card"><div class="row"><span class="eb" style="color:var(--mu)">SCOUT REPORT</span><span class="mu" style="font-size:11px;margin:0">시작능력치의 합은 50입니다</span></div>${sn.map((n,i)=>`<div class="sr2"><span>${n}</span><b ${ch.focus.includes(i)?'class="bl"':''}>${c.s[i].toFixed(1)}</b><div class="br"><i style="width:${c.s[i]/20*100}%;background:${COL[i]}"></i></div></div>`).join('')}</div>
  <button class="ghost wide" onclick="reroll()">🎲 후보 다시 뽑기 (남은 ${ch.rr}회)</button>
  <h3>선호 역할 선택</h3><p class="mu">원하는 역할을 선택하세요. 역할에 맞는 능력치가 더 잘 자랍니다.</p>
  <div class="opts">${ROLE[pos].map((r,i)=>`<button class="opt ${ch.role===i?'on':''}" onclick="ch.role=${i};render()">${r}${i===ch.i?'<span class="rec">추천</span>':''}</button>`).join('')}</div>
  <h3 style="margin-top:18px">플레이 스타일 선택</h3><p class="mu">시즌 기록에 작은 보정이 붙습니다.</p>
  <div class="opts o2">${STY.map((s,i)=>`<button class="opt ${ch.style===i?'on':''}" onclick="ch.style=${i};render()"><span>${s[0]}<small>${s[1]}</small></span>${i===SREC[pos]?'<span class="rec">추천</span>':''}</button>`).join('')}</div>
  <div class="row" style="margin-top:18px"><h3 style="margin:0">집중 육성 능력치</h3><span class="mu" style="margin:0;font-size:11px">최대 2개</span></div><p class="mu">성장치는 같고 배분만 달라집니다.</p>
  <div class="opts o2">${sn.map((n,i)=>`<button class="opt ${ch.focus.includes(i)?'on':''}" onclick="togFocus(${i})"><span>${n}</span><b>${c.s[i].toFixed(1)}</b></button>`).join('')}</div>
  <div style="height:16px"></div><button class="cta" onclick="begin()">이 후보로 진행 →</button><button class="ghost mu wide" onclick="view='create';render()">← 이전</button></div>`;
}
function begin(){
  const c=cand[ch.i],pos=cr.pos,h=({FW:R(172,188),MF:R(168,184),DF:R(176,192),GK:R(184,198)})[pos],wt=Math.round((h-100)*(.9+Math.random()*.1));
  S.p={name:cr.name.trim(),no:cr.no,foot:cr.foot,pos,school:cr.school.trim(),wish:cr.wish,arch:c.l,stats:[...c.s],w:ARCH[pos][ch.role][2],role:ROLE[pos][ch.role],style:STY[ch.style][0],focus:[...ch.focus],h,wt,
    age:18,yi:0,stage:'hs',phase:'hub',club:null,salary:0,special:3,goal:0,approach:1,hsT:0,hsRes:[],apH:[],hsBonus:0,pow:R(56,80),seasons:[],honors:[],log:['고3 시즌이 시작됐어요!'],fame:0,peak:50,maxT:0,mil:'미필',nego:null,fresh:false,tot:{g:0,a:0,apps:0}};

  save();

  <button class="cta" onclick="hideM();view='game';tab='season';render()">확인 →</button>`);

/* ===== 게임 화면 ===== */
function vGame(){
  const p=S.p;if(!p){view='home';return vHome()}
  const T=[['season','시즌'],['career','커리어'],['player','선수'],['honors','우승 연혁']];

}
function vSeason(){
  const p=S.p;
  if(p.stage==='ret')return `<div class="card" style="text-align:center"><h2>은퇴했어요</h2><p class="mu">${esc(p.name)} 선수의 커리어가 명예의 전당에 기록됐어요.</p></div><button class="cta" onclick="startNew()">새로운 인생 시작 →</button>`;
  if(p.phase==='review')return vReview();
  if(p.phase==='grad')return vGrad();

function pcard(p,sub){

}
function specialCard(p){return `<button class="card row" style="width:100%;border-color:#bcd9f7" onclick="openSpecial()"><b style="color:var(--navy)">특별훈련</b><span class="bl" style="font-size:12px;font-weight:800">남은 기회 ${p.special}번 →</span></button>`}
function goalCard(p){return `<h3 style="margin-top:6px">이번 시즌 목표</h3><div class="opts o2" style="margin-bottom:12px">${GOALS.map((g,i)=>`<button class="opt ${p.goal===i?'on':''}" onclick="S.p.goal=${i};save();render()"><span>${g.n}<small>${g.d}</small></span></button>`).join('')}</div>`}

  if(pro&&p.mil==='상무')h+=`<div class="card tint"><b>상무 복무 중</b><span class="mu" style="margin:0"> · 남은 ${p.milLeft}시즌</span></div>`;

  return h;

function vGrad(){

function pool(p){const a=p.age;return a<=18?2.1:a<=21?3.2:a<=24?2.6:a<=27?1.2:a<=30?0:-1.2}

  if(P>=0){
    const wt=p.w.map((w,i)=>w*(p.focus.includes(i)?2.1:1)*(.85+Math.random()*.3));let rem=P;
    for(let k=0;k<3&&rem>.01;k++){
      const T=wt.reduce((x,y,i)=>x+(p.stats[i]<19.5?y:0),0);if(!T)break;let used=0;
      wt.forEach((w,i)=>{if(p.stats[i]>=19.5)return;const add=Math.min(rem*w/T,19.5-p.stats[i]);p.stats[i]+=add;used+=add});rem-=used;
    }
  }else p.stats=p.stats.map(v=>Math.max(3,v+P/5*(.6+Math.random()*.8)));

}

    if(cup==='우승')p.honors.push({y:sy,t:`${sy} ${pro?'FA컵':'대학 왕중왕전'} 우승`});
    if(ln.rt>=8.4&&apps>=18)p.honors.push({y:sy,t:`${sy} 올해의 선수 후보`});
    p.fame+=Math.max(0,Math.round(ln.rt-6))*2+(rank===1?5:0)+(p.goal===3?3:0);
    grow(p);p.seasons.push({k:pro?'pro':'univ',y:sy,age:p.age,club:c.n,apps,g:ln.g,a:ln.a,rt:ln.rt,role});
    p.tot.g+=ln.g;p.tot.a+=ln.a;p.tot.apps+=apps;p.peak=Math.max(p.peak,ovr(p));p.age++;p.yi++;
    const pct=Math.round(share*100);
    p.rev={head:ln.rt>=8?'리그를 지배한 시즌':ln.rt>=7.3?'주전 도약을 알린 시즌':ln.rt>=6.6?'꾸준함을 증명한 시즌':'성장통을 겪은 시즌',rtn:ln.rt,
      c1:[[gl[0],apps],[gl[1],ln.g],[gl[2],ln.a]],c2:[['평점',ln.rt.toFixed(1)],['팀 순위',rank+'위'],['출전률',pct+'%'],[p.pos==='GK'?'경기당 선방':'공격P',p.pos==='GK'?(ln.a/Math.max(apps,1)).toFixed(1):ln.g+ln.a]],
      rt:pro?'리그·컵 결과':'대학 대회 결과',res:items.map(x=>({l:x.l,n:x.n,r:x.r})),from:o0,to:ovr(p),ch:diffs(p,before),
      det:[`소속: ${c.n} (${pro?TI[c.t].n:'대학 리그'})`,`지위: ${role}`,`시즌 목표: ${GOALS[p.goal].n}`,`플레이 스타일: ${p.style}`,inj?'시즌 중 부상으로 일부 경기에 결장했어요':'큰 부상 없이 시즌을 마쳤어요'],fan:fanText(ln.rt),nat};
    log(p,`📅 ${sy} ${c.n} · ${apps}경기 ${ln.g}${gl[1]==='골'?'골':''} ${ln.a}${gl[2]} · 평점 ${ln.rt.toFixed(1)}`);
    p.phase='review';tab='season';save();render();
  }finally{busy=false}
}

/* ===== 다음 단계 / 이적 / 계약 ===== */
function nextStep(){
  const p=S.p;
  if(p.stage==='hs'){p.phase='grad';save();render();return}
  if(p.stage==='univ'){
    const y=p.u.y;
    if(y===2){const i=draftInfo(p,'univ');modal(`<h3>2학년 드래프트</h3><p class="mu">지금 프로 드래프트에 도전할까요? 계속 성장한 뒤 4학년에 도전할 수도 있어요.</p><div class="seg s2"><div><small>지명 확률</small><b class="bl">${Math.round(i.prob*100)}%</b></div><div><small>예상 지명</small><b>${i.lo===i.hi?i.lo:i.lo+'~'+i.hi}라운드</b></div></div><button class="cta" onclick="runDraft('univ')">드래프트 참가</button><button class="ghost wide" onclick="S.p.u.y++;toHub()">3학년으로 계속</button>`);return}
    if(y>=4){runDraft('univ');return}
    p.u.y++;toHub();return;
  }
  const c=CL[p.club],o=ovr(p);
  if(p.age>=38||(o<clv(c)-16&&p.age>=31)){modal(`<h3>은퇴를 결정할 때예요</h3><p class="mu">몸이 예전 같지 않아요. 긴 커리어를 마무리합니다.</p><button class="cta" onclick="retire()">은퇴하기</button>`);return}
  if(p.mil==='상무'){p.milLeft--;if(p.milLeft<=0){p.club=p.prev.club;p.salary=p.prev.sal;p.mil='전역';p.fresh=true;log(p,'🎖️ 상무 전역! 원소속팀으로 복귀했어요');toast('상무 전역 · 원소속팀 복귀')}else{p.fresh=true}toHub();return}
  if(p.mil==='미필'&&p.age>=28){enlist(true);return}
  if(o<clv(c)-12&&c.t>0){const nc=pick(CL.filter(x=>x.t===c.t-1));p.club=nc.id;p.fresh=true;p.salary=Math.round(p.salary*.7/100)*100;log(p,`📉 방출 통보... ${nc.n}으로 이적`);toast('방출 통보 · '+nc.n+'으로 이적했어요')}
  else if(c.t<3&&c.id!==SANG&&o>=TI[c.t+1].lv-4&&(p.rev.rtn>=7||p.goal===3)&&Math.random()<(p.goal===3?.85:.6)){offerModal();return}
  toHub();
}
function offerModal(){
  const p=S.p,c=CL[p.club],nt=c.t+1,cl=pick(CL.filter(x=>x.t===nt)),sal=payFor(nt,ovr(p));pend={cl:cl.id,sal};
  modal(`<div class="eb">TRANSFER OFFER</div><h2 style="margin:6px 0">${cl.n}의 이적 제안</h2><p class="mu">${TI[nt].n} · 더 높은 무대지만 주전 경쟁이 치열해요.</p><div class="seg s2"><div><small>현재 연봉</small><b>${money(p.salary)}</b></div><div><small>제안 연봉</small><b class="bl">${money(sal)}</b></div></div><button class="cta" onclick="acceptOffer()">수락하고 이적</button><button class="ghost wide" onclick="hideM();toHub()">거절하고 잔류</button>`);
}
function acceptOffer(){const p=S.p;p.club=pend.cl;p.salary=pend.sal;p.maxT=Math.max(p.maxT,CL[p.club].t);p.fresh=true;p.fame+=5;p.honors.push({y:2026+p.yi,t:`${2026+p.yi} ${CL[p.club].n} 이적`});log(p,`✈️ ${CL[p.club].n}로 이적!`);toast('이적 완료!');toHub()}
function toHub(){
  hideM();const p=S.p;p.phase='hub';p.special=3;p.sgTried=false;
  const pr=p.seasons.filter(s=>s.k==='pro');
  if(p.stage==='pro'&&!p.fresh&&pr.length){
    const l=pr[pr.length-1],rs=clamp((l.rt-6.6)*.16+(l.apps/34-.5)*.1,-.1,.6);
    p.nego={prev:p.salary,offer:Math.max(Math.round(p.salary*.9/100)*100,Math.round(p.salary*(1+rs)/100)*100),used:false};
  }else p.nego=null;
  p.fresh=false;tab='season';save();render();
}
function renego(){
  const n=S.p.nego;if(!n||n.used)return;n.used=true;
  if(Math.random()<.5){n.offer=Math.round(n.offer*1.12/100)*100;toast('재협상 성공! 제시액이 올랐어요')}
  else{n.offer=Math.max(Math.round(n.prev*.9/100)*100,Math.round(n.offer*.96/100)*100);toast('구단이 난색을 표했어요. 제시액이 내려갔어요')}
  save();render();
}
function acceptNego(){const p=S.p;p.salary=p.nego.offer;p.nego=null;playSeason()}
function tradeAsk(){
  const p=S.p,c=CL[p.club],opts=CL.filter(x=>x.t===c.t&&x.id!==c.id&&x.id!==SANG).sort(()=>Math.random()-.5).slice(0,3);
  modal(`<h3>트레이드 요청</h3><p class="mu">이적을 원하는 구단을 고르세요. 구단이 요청을 받아들일지는 알 수 없어요.</p><div class="opts">${opts.map(x=>`<button class="opt" onclick="doTrade(${x.id})"><span>${x.n}<small>${x.s<c.s?'주전 경쟁 낮음':x.s>c.s?'우승권 · 경쟁 치열':'비슷한 전력'}</small></span></button>`).join('')}</div><button class="ghost wide" style="margin-top:10px" onclick="hideM()">취소</button>`);
}
function doTrade(id){
  const p=S.p;hideM();
  if(Math.random()<.65){p.club=id;p.fresh=true;p.nego=null;p.maxT=Math.max(p.maxT,CL[id].t);log(p,`🔁 ${CL[id].n}로 트레이드`);toast(CL[id].n+'로 이적 성공!')}
  else{p.fame=Math.max(0,p.fame-2);toast('구단이 요청을 거절했어요. 감독과 서먹해졌어요 (인지도 -2)')}
  save();render();
}
function applySangmu(){
  const p=S.p,pr=clamp((ovr(p)-58)*.035+.25,.1,.85);
  if(Math.random()<pr){p.prev={club:p.club,sal:p.salary};p.club=SANG;p.mil='상무';p.milLeft=2;p.salary=2000;p.nego=null;p.fresh=true;p.honors.push({y:2026+p.yi,t:'상무 합격'});log(p,'🎖️ 상무에 합격했어요!');toast('상무 합격! 2시즌간 복무해요')}
  else{p.sgTried=true;toast('상무 선발에서 탈락했어요. 내년에 다시 도전할 수 있어요')}
  save();render();
}
function enlist(force){
  modal(`<h3>${force?'병역 의무 이행':'현역 입대'}</h3><p class="mu">${force?'만 28세가 되어 더는 미룰 수 없어요. ':''}2년간 경기 공백이 생기고 능력치가 조금 떨어질 수 있어요. 전역 후 같은 팀과 재계약해요.</p><button class="cta" onclick="doEnlist()">입대하기</button>${force?'':'<button class="ghost wide" onclick="hideM()">취소</button>'}`);
}
function doEnlist(){
  const p=S.p;hideM();
  for(let i=0;i<2;i++){p.seasons.push({k:'mil',y:2026+p.yi,age:p.age,club:'군 복무',apps:0,g:0,a:0,rt:0,role:'복무'});p.age++;p.yi++;p.stats=p.stats.map(v=>r1(Math.max(3,v-R(0,3)/10)))}
  p.mil='전역';p.salary=Math.round(p.salary*.9/100)*100;p.fresh=true;p.honors.push({y:2026+p.yi,t:'병역 이행 완료'});log(p,'🎖️ 현역 복무를 마치고 전역했어요');
  toast('전역! 다시 그라운드로');toHub();
}

/* ===== 은퇴 / 새 인생 ===== */
function askRetire(){modal(`<h3>은퇴할까요?</h3><p class="mu">은퇴하면 커리어가 명예의 전당에 기록돼요.</p><button class="cta" onclick="retire()">은퇴하기</button><button class="ghost wide" onclick="hideM()">조금 더 뛰기</button>`)}
function retire(){
  const p=S.p;if(!p||p.stage==='ret')return;
  const sc=Math.round(p.tot.g*2+p.tot.a*1.2+p.tot.apps*.3+p.honors.length*12+p.peak*3+p.fame*.5+p.maxT*25),tag=sc>=700?'전설':sc>=420?'레전드급':sc>=220?'스타':sc>=90?'준수한 프로':'무명 선수',gl=glab(p);
  const last=p.stage==='pro'?CL[p.club].n:cname(p);
  p.stage='ret';p.phase='ret';S.hall.push({name:p.name,pos:p.pos,sc,peak:p.peak,club:last,tag});S.hall=S.hall.slice(-30);save();
  modal(`<div class="eb">RETIREMENT</div><h2 style="margin:6px 0">${tag}</h2><div class="card"><div class="ch"><span>통산 출전</span><b>${p.tot.apps}경기</b></div><div class="ch"><span>통산 ${gl[1]} / ${gl[2]}</span><b>${p.tot.g} / ${p.tot.a}</b></div><div class="ch"><span>최고 OVR</span><b>${p.peak.toFixed(1)}</b></div><div class="ch"><span>연혁</span><b>${p.honors.length}개</b></div><div class="ch"><span>커리어 점수</span><b class="bl">${sc}</b></div></div><button class="cta" onclick="startNew()">새로운 인생 시작 →</button><button class="ghost wide" onclick="hideM();goHome()">홈으로</button>`);
}
function newLife(){startNew()}

render();
</script>
